services:
  postgres:
    image: postgres:16-alpine
    container_name: sao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sao_blog}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sao} -d ${POSTGRES_DB:-sao_blog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sao-network

  redis:
    image: redis:7-alpine
    container_name: sao-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sao-network

  minio:
    image: minio/minio:latest
    container_name: sao-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sao-network

  minio-init:
    image: minio/mc
    container_name: sao-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-sao-blog};
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET:-sao-blog};
      exit 0;
      "
    networks:
      - sao-network

  server:
    image: ${SAO_SERVER_IMAGE}
    container_name: sao-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sao_blog}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-sao-blog}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: "3000"
      NODE_ENV: production
      UPLOAD_DIR: ./uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - sao-network

  web:
    image: ${SAO_WEB_IMAGE}
    container_name: sao-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - sao-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  uploads-data:
    driver: local

networks:
  sao-network:
    driver: bridge

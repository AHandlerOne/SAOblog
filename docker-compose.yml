services:
  # PostgreSQL 16 with pg_trgm extension
  postgres:
    image: postgres:16-alpine
    container_name: sao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sao
      POSTGRES_PASSWORD: sao123
      POSTGRES_DB: sao_blog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/server/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sao -d sao_blog"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sao-network

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: sao-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sao-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: sao-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sao-network

  # MinIO Client to initialize bucket
  minio-init:
    image: minio/mc
    container_name: sao-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/sao-blog;
      /usr/bin/mc anonymous set public myminio/sao-blog;
      exit 0;
      "
    networks:
      - sao-network

  # Fastify Backend
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: sao-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://sao:sao123@postgres:5432/sao_blog
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - sao-network

  # Vue Frontend (nginx)
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: sao-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - sao-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  uploads-data:
    driver: local

networks:
  sao-network:
    driver: bridge
